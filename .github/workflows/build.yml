name: Build and verify source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify source and dependency pins
        run: node tools/verify-source.js
      - name: Build, test and package runtime
        id: package
        shell: powershell
        run: |
          ./build.ps1
          $package = Get-Content build/latest-package.json -Raw | ConvertFrom-Json
          "archive=$($package.archive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "nexus_archive=$($package.nexusArchive)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Ensure generators leave tracked source unchanged
        run: git diff --exit-code
      - name: Upload complete runtime package and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slorm-loader-runtime-development
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.nexus_archive }}
            build/build-provenance.json
            build/package-results.json

  attest:
    # GitHub Free supports attestations for public repositories. Private
    # development builds still compile/test/upload with read-only permissions.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slorm-loader-runtime-development
          path: artifacts
      - name: Attest outputs built in this run
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/**/*.zip
